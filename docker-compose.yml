x-backend-default-environment: &backend-default-environment
  AD_META_ENVIRONMENT: production
  AD_META_STORAGE_ROOT: /app/storage
  AD_META_DB_ENGINE: mysql
  AD_META_MYSQL_HOST: mysql
  AD_META_MYSQL_PORT: 3306
  AD_META_MYSQL_USER: ${AD_META_MYSQL_USER:-ad_meta}
  AD_META_MYSQL_PASSWORD: ${AD_META_MYSQL_PASSWORD:-ad_meta-local-only}
  AD_META_MYSQL_DATABASE: ${AD_META_MYSQL_DATABASE:-ad_meta}
  AD_META_STATS_WORKER_URL: http://stats-worker:8001

x-backend-external-environment: &backend-external-environment
  AD_META_ENVIRONMENT: production
  AD_META_STORAGE_ROOT: /app/storage
  AD_META_DB_ENGINE: mysql
  AD_META_MYSQL_HOST: ${AD_META_MYSQL_HOST:-host.docker.internal}
  AD_META_MYSQL_PORT: ${AD_META_MYSQL_PORT:-3306}
  AD_META_MYSQL_USER: ${AD_META_MYSQL_USER:-ad_meta}
  AD_META_MYSQL_PASSWORD: ${AD_META_MYSQL_PASSWORD:-}
  AD_META_MYSQL_DATABASE: ${AD_META_MYSQL_DATABASE:-ad_meta}
  AD_META_STATS_WORKER_URL: http://stats-worker:8001

x-backend-volumes: &backend-volumes
  - ./backend/storage/raw:/app/storage/raw:ro
  - cache_data:/app/storage/cache
  - staging_data:/app/storage/staging

services:
  mysql:
    image: mysql:8.4.5
    environment:
      MYSQL_DATABASE: ${AD_META_MYSQL_DATABASE:-ad_meta}
      MYSQL_USER: ${AD_META_MYSQL_USER:-ad_meta}
      MYSQL_PASSWORD: ${AD_META_MYSQL_PASSWORD:-ad_meta-local-only}
      MYSQL_ROOT_PASSWORD: ${AD_META_MYSQL_ROOT_PASSWORD:-root-local-only}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  stats-worker:
    image: ad-meta-stats-worker:local
    build:
      context: ./stats-worker
    expose:
      - "8001"
    read_only: true
    tmpfs:
      - /tmp:size=1g
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    image: ad-meta-backend:local
    build:
      context: ./backend
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *backend-default-environment
    volumes: *backend-volumes
    read_only: true
    tmpfs:
      - /tmp:size=256m
    depends_on:
      backend-init:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend-init:
    image: ad-meta-backend:local
    command: ["python", "-m", "app.cli.prepare_runtime"]
    environment: *backend-default-environment
    volumes: *backend-volumes
    read_only: true
    tmpfs:
      - /tmp:size=256m
    depends_on:
      mysql:
        condition: service_healthy
      stats-worker:
        condition: service_healthy
    restart: "no"

  frontend:
    image: ad-meta-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${AD_META_FRONTEND_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend-external:
    profiles: ["external-mysql"]
    image: ad-meta-backend:local
    build:
      context: ./backend
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *backend-external-environment
    volumes: *backend-volumes
    read_only: true
    tmpfs:
      - /tmp:size=256m
    depends_on:
      backend-external-init:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend-external-init:
    profiles: ["external-mysql"]
    image: ad-meta-backend:local
    command: ["python", "-m", "app.cli.prepare_runtime"]
    environment: *backend-external-environment
    volumes: *backend-volumes
    read_only: true
    tmpfs:
      - /tmp:size=256m
    depends_on:
      stats-worker:
        condition: service_healthy
    restart: "no"

volumes:
  mysql_data:
  cache_data:
  staging_data:
