name: verify

on:
  push:
  pull_request:

jobs:
  python-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: backend/requirements.txt

  backend-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check app tests
        working-directory: backend
      - run: mypy app
        working-directory: backend
      - run: python -m app.cli.export_openapi --check
        working-directory: backend
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70
        working-directory: backend
        env:
          AD_META_DB_ENGINE: sqlite

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run openapi:types:check
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-output
          path: frontend/output/playwright
          if-no-files-found: ignore
          retention-days: 7

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.5
        env:
          MYSQL_DATABASE: ad_meta_test
          MYSQL_USER: ad_meta
          MYSQL_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uad_meta -ptest-password --silent"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements-dev.txt
      - run: alembic upgrade head
        working-directory: backend
        env:
          AD_META_DB_ENGINE: mysql
          AD_META_MYSQL_HOST: 127.0.0.1
          AD_META_MYSQL_USER: ad_meta
          AD_META_MYSQL_PASSWORD: test-password
          AD_META_MYSQL_DATABASE: ad_meta_test
      - run: pytest -q
        working-directory: backend
        env:
          AD_META_DB_ENGINE: mysql
          AD_META_MYSQL_HOST: 127.0.0.1
          AD_META_MYSQL_USER: ad_meta
          AD_META_MYSQL_PASSWORD: test-password
          AD_META_MYSQL_DATABASE: ad_meta_test

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v4
      - uses: docker/bake-action@v7
        with:
          source: .
          files: docker-compose.yml
          targets: backend,frontend,stats-worker
          load: true
          set: |
            backend.cache-from=type=gha,scope=backend
            backend.cache-to=type=gha,scope=backend,mode=max
            frontend.cache-from=type=gha,scope=frontend
            frontend.cache-to=type=gha,scope=frontend,mode=max
            stats-worker.cache-from=type=gha,scope=stats-worker
            stats-worker.cache-to=type=gha,scope=stats-worker,mode=max
      - run: docker compose up -d --wait --wait-timeout 1200 mysql stats-worker
      - run: docker compose run --rm --no-deps backend python -m app.cli.smoke_statistics_worker
      - run: docker compose up -d --wait --wait-timeout 1200 --scale backend=2
      - run: curl --fail --silent http://127.0.0.1:8080/ > /dev/null
      - if: failure()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v
