name: verify

on:
  push:
  pull_request:

jobs:
  python-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: backend/requirements.txt

  backend-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check app tests
        working-directory: backend
      - run: mypy app
        working-directory: backend
      - run: python -m app.cli.export_openapi --check
        working-directory: backend
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70
        working-directory: backend
        env:
          AD_META_DB_ENGINE: sqlite

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run openapi:types:check
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-output
          path: frontend/output/playwright
          if-no-files-found: ignore
          retention-days: 7

  mysql-integration:
    runs-on: ubuntu-24.04
    env:
      AD_META_DB_ENGINE: mysql
      AD_META_MYSQL_HOST: 127.0.0.1
      AD_META_MYSQL_USER: ad_meta
      AD_META_MYSQL_PASSWORD: test-password
      AD_META_MYSQL_DATABASE: ad_meta_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Start and prepare host MySQL
        env:
          MYSQL_PWD: root
        run: |
          sudo systemctl start mysql.service
          mysql --host=127.0.0.1 --user=root --execute "
            CREATE DATABASE ad_meta_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
            CREATE USER 'ad_meta'@'%' IDENTIFIED BY 'test-password';
            GRANT ALL PRIVILEGES ON ad_meta_test.* TO 'ad_meta'@'%';
          "
      - run: pip install -r backend/requirements-dev.txt
      - run: alembic upgrade head
        working-directory: backend
      - run: pytest -q
        working-directory: backend
