[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
incremental = false
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["alembic/"]
disable_error_code = [
  "operator",
  "arg-type",
  "misc",
  "call-overload",
  "return-value",
  "import-untyped",
  "var-annotated"
]
